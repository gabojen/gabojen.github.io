<script>
  /* 화면 테마 — 기본은 '밝게'. 사용자가 직접 고른 경우에만 기억합니다.
     (이전 버전이 자동으로 저장해둔 값은 무시하고 초기화) */
  (function(){ try{ localStorage.removeItem('theme'); }catch(e){} })();
  window.applyTheme=function(t,save){
    if(save){ try{localStorage.setItem('themeChoice',t);}catch(e){} }
    var dark = (t==='dark') || (t==='auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark',dark);
    var m=document.querySelector('meta[name=theme-color]');
    if(m)m.setAttribute('content',dark?'#17241f':'#BC482C');
  };
  (function(){
    var t='light';
    try{ var v=localStorage.getItem('themeChoice'); if(v==='light'||v==='dark'||v==='auto')t=v; }catch(e){}
    window.__theme=t; window.applyTheme(t,false);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
      if((window.__theme||'light')==='auto')window.applyTheme('auto',false);});
  })();
</script>
