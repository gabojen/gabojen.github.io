name: 여행 소식지 만들기
on:
  schedule:
    - cron: '0 20 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: '수집할 달 (비우면 이번 달). 예: 2026-09'
        required: false
permissions:
  contents: write
concurrency:
  group: travel-news
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 지역별 관광·문화·레포츠·시장·미식 수집
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          NEWS_MONTH: ${{ inputs.month }}
        run: node --dns-result-order=ipv4first tools/make-news.mjs "$NEWS_MONTH"
      - name: 검증된 여행 정보 반영
        run: |
          git config user.name "gabojen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news/*.json
          if ! git diff --staged --quiet; then
            git commit -m "지역별 다양한 여행 정보 갱신"
            git pull --rebase origin main
            git push
          fi
